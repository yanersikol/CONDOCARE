<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CondoCare</title>
    <link rel="icon" type="image/png" href="images/CC.png">
    <link rel="stylesheet" href="stylesheet.css">
     
</head>

    <body>
        <div class="login-container">

        <img src="images/CClogo.png" alt="CondoCare Logo" class="logo">

        <div class="login-box">
        <h1>CONDOCARE</h1>
        <p class ="subtitle">Condominium Maintenance Management System</p>
        <h2>Welcome Back!</h2>
        <p class="subtitle">Log in to access your account.</p>

        <label for="accountType">Login As</label>

            <select id="accountType" onchange="changeLoginFields()">
                <option value="customer">Resident</option>
                <option value="staff">Staff</option>
            </select>

        <form id="loginForm">
            <div class="input-box">
                <label id="idLabel" for="userID">Unit Number:</label>

                <input type="text" id= "userID" placeholder="Enter your unit number" required>
            </div>

             <div class="input-box">
                <label id="codeLabel" for="usercode">Resident Code:</label>
                <input type="text" id= "usercode" placeholder="enter your resident code" required>
            </div>

             <div class="input-box">
                <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit">LOGIN</button>

            <p id="errorMessage"></p>
        </form>

        <p class="signup">
            Don't have an account?
            <a href="#">Register here</a>
        </p>

        </div>
        <script src="script.js"></script>
    </body>
</html>
